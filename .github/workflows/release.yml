name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'NextUI/**'
      - 'Standard RetroArch/**'
      - 'README.md'
      - 'RELEASE_NOTES.md'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from commit message
        id: version
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -iE "release v[0-9]+\.[0-9]+\.[0-9]+" > /dev/null; then
            VERSION=$(echo "$MSG" | grep -ioE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1)
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create zips
        run: |
          mkdir -p artifacts
          cp "Standard RetroArch/README_GLSL.md" README_GLSL.md
          zip -r artifacts/PT-SkyWalker541-NextUI.zip NextUI \
            -x "*.DS_Store" -x "*._*" -x "*__MACOSX/*"
          zip -r artifacts/PT-SkyWalker541-Standard-RetroArch.zip "Standard RetroArch" \
            -x "Standard RetroArch/README_GLSL.md" -x "*.DS_Store" -x "*._*" -x "*__MACOSX/*"
          zip artifacts/PT-SkyWalker541-README_GLSL.zip README_GLSL.md

      - name: Delete existing latest release (for updates)
        if: steps.version.outputs.is_release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create or update latest release
        if: steps.version.outputs.is_release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            artifacts/PT-SkyWalker541-NextUI.zip \
            artifacts/PT-SkyWalker541-Standard-RetroArch.zip \
            artifacts/PT-SkyWalker541-README_GLSL.zip \
            --title "PT SkyWalker541 — Latest" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Create versioned release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            artifacts/PT-SkyWalker541-NextUI.zip \
            artifacts/PT-SkyWalker541-Standard-RetroArch.zip \
            artifacts/PT-SkyWalker541-README_GLSL.zip \
            --title "PT SkyWalker541 $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest
